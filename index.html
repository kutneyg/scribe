<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advising Appointment Scribe & Ingestion Preparer</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #cccccc;
            --accent-green: #2ec4b6;
            --accent-yellow: #f1c40f;
            --accent-red: #e74c3c;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            padding: 25px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #111;
            text-align: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 12px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #444;
        }

        input, select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff3b30;
            margin-right: 8px;
            display: inline-block;
        }

        .indicator.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        .indicator.paused {
            background-color: var(--accent-yellow);
            box-shadow: 0 0 8px var(--accent-yellow);
            animation: none;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-start { background-color: var(--primary); color: white; }
        .btn-start:hover { background-color: var(--primary-hover); }

        .btn-pause { background-color: var(--accent-yellow); color: #333; display: none; }
        .btn-pause:hover { background-color: #dbb20a; }

        .btn-resume { background-color: var(--accent-green); color: white; display: none; }
        .btn-resume:hover { background-color: #249b8f; }

        .btn-stop { background-color: #222222; color: white; display: none; }
        .btn-stop:hover { background-color: #111111; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media (min-width: 768px) {
            .workspace {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 340px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            background-color: #fafafa;
            font-family: inherit;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .btn-action {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e2e8f0;
            color: #1a202c;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-action:hover { background-color: #cbd5e1; }

        .hashtag-bank {
            margin-top: 15px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .hashtag-bank h4 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #475569;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tag-btn:hover {
            background: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
        }
        .tag-btn.selected {
            background: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Advising Appointment Scribe & Ingestion Preparer</h2>
    
    <div class="meta-grid">
        <div class="form-group">
            <label for="studentName">Student Preferred Name</label>
            <input type="text" id="studentName" placeholder="e.g., Casey">
        </div>
        <div class="form-group">
            <label for="studentMajor">Major / Intended Major</label>
            <input type="text" id="studentMajor" placeholder="e.g., Psychology">
        </div>
        <div class="form-group">
            <label for="classYear">Class Year</label>
            <select id="classYear">
                <option value="">Select Year...</option>
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
                <option value="Alumni">Alumni</option>
            </select>
        </div>
        <div class="form-group">
            <label for="apptType">Appointment Type</label>
            <input type="text" id="apptType" placeholder="e.g., TD - Career Exploration">
        </div>
    </div>
    
    <div class="status-container">
        <span id="statusIndicator" class="indicator"></span>
        <span id="statusText">System Idle</span>
    </div>

    <div class="control-panel">
        <button id="startBtn" class="btn btn-start">Start Capture</button>
        <button id="pauseBtn" class="btn btn-pause">Pause Session</button>
        <button id="resumeBtn" class="btn btn-resume">Resume Session</button>
        <button id="stopBtn" class="btn btn-stop">Stop Capture</button>
    </div>

    <div class="workspace">
        <div class="panel">
            <label for="transcriptBox">Live Feed Stream (Raw Continuous Capture)</label>
            <textarea id="transcriptBox" placeholder="Text stream will isolate here once hardware begins listening..."></textarea>
            <button id="copyTranscriptBtn" class="btn btn-action">Copy Raw Stream</button>
        </div>
        
        <div class="panel">
            <label for="cleanNoteBox">Formatted AI Ingestion Payload Pack</label>
            <textarea id="cleanNoteBox" placeholder="The structured workspace execution block will update here..."></textarea>
            <button id="copyNoteBtn" class="btn btn-action" style="background-color: var(--primary); color: white;">Copy Prompt Payload</button>
        </div>
    </div>

    <div class="hashtag-bank">
        <h4>Select Relevant Advising Hashtags:</h4>
        <div class="tag-cloud" id="tagCloud">
            <button class="tag-btn" data-tag="#careerexploration">#careerexploration</button>
            <button class="tag-btn" data-tag="#majorselection">#majorselection</button>
            <button class="tag-btn" data-tag="#resumereview">#resumereview</button>
            <button class="tag-btn" data-tag="#coverletter">#coverletter</button>
            <button class="tag-btn" data-tag="#internshipsearch">#internshipsearch</button>
            <button class="tag-btn" data-tag="#jobsearch">#jobsearch</button>
            <button class="tag-btn" data-tag="#mockinterview">#mockinterview</button>
            <button class="tag-btn" data-tag="#actionplan">#actionplan</button>
            <button class="tag-btn" data-tag="#followup">#followup</button>
            <button class="tag-btn" data-tag="#internationalstudents">#internationalstudents</button>
        </div>
    </div>
</div>

<script>
    let recognition;
    let isRecording = false;
    let isPaused = false;
    let finalTranscript = '';
    let selectedTags = new Set();

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    const transcriptBox = document.getElementById('transcriptBox');
    const cleanNoteBox = document.getElementById('cleanNoteBox');
    
    const studentName = document.getElementById('studentName');
    const studentMajor = document.getElementById('studentMajor');
    const classYear = document.getElementById('classYear');
    const apptType = document.getElementById('apptType');

    const copyTranscriptBtn = document.getElementById('copyTranscriptBtn');
    const copyNoteBtn = document.getElementById('copyNoteBtn');
    const tagCloud = document.getElementById('tagCloud');

    [studentName, studentMajor, classYear, apptType, transcriptBox].forEach(element => {
        element.addEventListener('input', generateIngestionPayload);
    });

    tagCloud.addEventListener('click', (e) => {
        if (e.target.classList.contains('tag-btn')) {
            const tag = e.target.getAttribute('data-tag');
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
                e.target.classList.remove('selected');
            } else {
                selectedTags.add(tag);
                e.target.classList.add('selected');
            }
            generateIngestionPayload();
        }
    });

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            if (!isPaused) {
                statusIndicator.className = 'indicator active';
                statusText.innerText = "Listening actively...";
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech Recognition System Error: ", event.error);
        };

        recognition.onend = () => {
            if (isRecording && !isPaused) {
                recognition.start();
            }
        };

        recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + ' ';
                }
            }
            transcriptBox.value = finalTranscript.trim();
            generateIngestionPayload();
        };
    } else {
        startBtn.disabled = true;
        statusText.innerText = "Local browser lacks speech parameters compatibility.";
    }

    // Capture Loop State Triggers (Pause/Stop Fully Wrapped Back In)
    startBtn.addEventListener('click', () => {
        finalTranscript = '';
        transcriptBox.value = '';
        isRecording = true;
        isPaused = false;
        recognition.start();
        
        startBtn.style.display = 'none';
        pauseBtn.style.display = 'inline-block';
        resumeBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        generateIngestionPayload();
    });

    pauseBtn.addEventListener('click', () => {
        if (isRecording && !isPaused) {
            isPaused = true;
            recognition.stop();
            statusIndicator.className = 'indicator paused';
            statusText.innerText = "Hardware feed paused.";
            pauseBtn.style.display = 'none';
            resumeBtn.style.display = 'inline-block';
        }
    });

    resumeBtn.addEventListener('click', () => {
        if (isRecording && isPaused) {
            isPaused = false;
            recognition.start();
            statusIndicator.className = 'indicator active';
            statusText.innerText = "Listening actively...";
            resumeBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';
        }
    });

    stopBtn.addEventListener('click', () => {
        isRecording = false;
        isPaused = false;
        recognition.stop();
        startBtn.style.display = 'inline-block';
        pauseBtn.style.display = 'none';
        resumeBtn.style.display = 'none';
        stopBtn.style.display = 'none';
        statusIndicator.className = 'indicator';
        statusText.innerText = "System Idle";
        generateIngestionPayload();
    });

    // Payloads Generator formatting structural arrays
    function generateIngestionPayload() {
        const name = studentName.value.trim() || "[Student Preferred Name]";
        const major = studentMajor.value.trim() || "[Major]";
        const year = classYear.value || "[Year]";
        const type = apptType.value.trim() || "[Appointment Type]";
        let rawText = transcriptBox.value.trim();

        if (!rawText) {
            cleanNoteBox.value = "Waiting for raw conversation feed data stream input to compile execution parameters...";
            return;
        }

        const tagArray = Array.from(selectedTags);
        const tagsString = tagArray.length > 0 ? tagArray.join(' ') : "None selected";

        // Automated execution prompt template wrapping logic
        let compiledBlock = `/appointment_note\n\n`;
        compiledBlock += `Generate an appointment observation of a career advising appointment with ${name}, a ${major} major in the ${year} class.\n\n`;
        compiledBlock += `[CONTEXT PARAMS]\n`;
        compiledBlock += `- Appointment Type Focus: ${type}\n`;
        compiledBlock += `- Selected Relevance Tags: ${tagsString}\n\n`;
        compiledBlock += `[RAW AUDIO CONVERSATION CONTEXT]\n`;
        compiledBlock += `"${rawText}"`;

        cleanNoteBox.value = compiledBlock;
    }

    copyTranscriptBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(transcriptBox.value);
    });

    copyNoteBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(cleanNoteBox.value);
        const origColor = copyNoteBtn.style.backgroundColor;
        copyNoteBtn.style.backgroundColor = "#2ec4b6";
        copyNoteBtn.innerText = "Payload Copied!";
        setTimeout(() => {
            copyNoteBtn.style.backgroundColor = origColor;
            copyNoteBtn.innerText = "Copy Prompt Payload";
        }, 2000);
    });
</script>

</body>
</html>
