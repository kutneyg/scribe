<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advising Scribe & Ingestion Preparer</title>
    <meta name="description" content="Career advising live transcription and structured AI ingestion prompt preparer.">
    <style>
        :root {
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #cccccc;
            --accent-green: #2ec4b6;
            --accent-yellow: #f1c40f;
            --accent-red: #e74c3c;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            padding: 25px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #111;
            text-align: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        /* Context Switcher Styling */
        .context-switcher {
            display: flex;
            justify-content: center;
            background: #e2e8f0;
            padding: 6px;
            border-radius: 30px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .context-btn {
            flex: 1;
            padding: 10px 20px;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.2s ease;
            text-align: center;
        }

        .context-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(0,102,204,0.3);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #444;
        }

        input, select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff3b30;
            margin-right: 8px;
            display: inline-block;
        }

        .indicator.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        .indicator.paused {
            background-color: var(--accent-yellow);
            box-shadow: 0 0 8px var(--accent-yellow);
            animation: none;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-start { background-color: var(--primary); color: white; }
        .btn-start:hover { background-color: var(--primary-hover); }

        .btn-pause { background-color: var(--accent-yellow); color: #333; display: none; }
        .btn-pause:hover { background-color: #dbb20a; }

        .btn-resume { background-color: var(--accent-green); color: white; display: none; }
        .btn-resume:hover { background-color: #249b8f; }

        .btn-stop { background-color: #222222; color: white; display: none; }
        .btn-stop:hover { background-color: #111111; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media (min-width: 768px) {
            .workspace {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 360px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            background-color: #fafafa;
            font-family: inherit;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .btn-action {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e2e8f0;
            color: #1a202c;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-action:hover { background-color: #cbd5e1; }

        .panel-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .panel-actions .btn-action {
            flex: 1;
            margin-top: 0;
        }

        .hashtag-bank {
            margin-top: 15px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .hashtag-bank h4 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #475569;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tag-btn:hover {
            background: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
        }
        .tag-btn.selected {
            background: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Advising Scribe & Ingestion Preparer</h2>
    
    <div class="context-switcher">
        <button id="liveModeBtn" class="context-btn active" onclick="switchContext('live')">Live Session Conversation</button>
        <button id="dictateModeBtn" class="context-btn" onclick="switchContext('dictate')">Post-Appointment Dictation</button>
    </div>
    
    <div class="meta-grid">
        <div class="form-group">
            <label for="studentName">Student Preferred Name</label>
            <input type="text" id="studentName" placeholder="e.g., Casey">
        </div>
        <div class="form-group">
            <label for="studentPronouns">Preferred Pronouns</label>
            <select id="studentPronouns">
                <option value="">Select Pronouns...</option>
                <option value="they/them">they/them</option>
                <option value="she/her">she/her</option>
                <option value="he/him">he/him</option>
                <option value="not specified">Prefer not to specify</option>
            </select>
        </div>
        <div class="form-group">
            <label for="classYear">Class Year</label>
            <select id="classYear">
                <option value="">Select Year...</option>
                <option value="Freshman">Freshman</option>
                <option value="Sophomore">Sophomore</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
                <option value="Alumni">Alumni</option>
            </select>
        </div>
        <div class="form-group">
            <label for="studentMajor">Major / Intended Major</label>
            <input type="text" id="studentMajor" placeholder="e.g., Psychology">
        </div>
        <div class="form-group">
            <label for="noteLength">Observation Detail Format</label>
            <select id="noteLength">
                <option value="Standard" selected>Standard (Comprehensive)</option>
                <option value="Condensed">Condensed (Short Summary)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="apptSequence">Appointment Sequence</label>
            <select id="apptSequence">
                <option value="First Appointment">First Appointment</option>
                <option value="Follow-Up Appointment" selected>Follow-Up Appointment</option>
            </select>
        </div>
        <div class="form-group" style="grid-column: span 1;">
            <label for="apptType">Appointment Type</label>
            <input type="text" id="apptType" placeholder="e.g., TD - Career Exploration">
        </div>
    </div>
    
    <div class="status-container">
        <span id="statusIndicator" class="indicator"></span>
        <span id="statusText">System Idle</span>
    </div>

    <div class="control-panel">
        <button id="startBtn" class="btn btn-start">Start Capture</button>
        <button id="pauseBtn" class="btn btn-pause">Pause Session</button>
        <button id="resumeBtn" class="btn btn-resume">Resume Session</button>
        <button id="stopBtn" class="btn btn-stop">Stop Capture</button>
    </div>

    <div class="workspace">
        <div class="panel">
            <label id="feedLabel" for="transcriptBox">Live Feed Stream (Raw Continuous Dialogue)</label>
            <textarea id="transcriptBox" placeholder="Text stream will isolate here once hardware begins listening..."></textarea>
            <input type="file" id="audioFileInput" accept="audio/*,.mp3,.wav,.m4a,.webm,.ogg" style="display: none;">
            <div class="panel-actions">
                <button id="copyTranscriptBtn" class="btn btn-action">Copy Raw Stream</button>
                <button id="uploadAudioBtn" class="btn btn-action">Transcribe Audio File</button>
            </div>
        </div>
        
        <div class="panel">
            <label for="cleanNoteBox">Structured AI Ingestion Prompt Payload</label>
            <textarea id="cleanNoteBox" placeholder="The wrapped context execution prompt payload will update here..."></textarea>
            <button id="copyNoteBtn" class="btn btn-action" style="background-color: var(--primary); color: white;">Copy Prompt Payload</button>
        </div>
    </div>

    <div class="hashtag-bank">
        <h4>Select Relevant Advising Hashtags:</h4>
        <div class="tag-cloud" id="tagCloud">
            <button class="tag-btn" data-tag="#careerexploration">#careerexploration</button>
            <button class="tag-btn" data-tag="#majorselection">#majorselection</button>
            <button class="tag-btn" data-tag="#resumereview">#resumereview</button>
            <button class="tag-btn" data-tag="#coverletter">#coverletter</button>
            <button class="tag-btn" data-tag="#internshipsearch">#internshipsearch</button>
            <button class="tag-btn" data-tag="#jobsearch">#jobsearch</button>
            <button class="tag-btn" data-tag="#mockinterview">#mockinterview</button>
            <button class="tag-btn" data-tag="#actionplan">#actionplan</button>
            <button class="tag-btn" data-tag="#followup">#followup</button>
            <button class="tag-btn" data-tag="#internationalstudents">#internationalstudents</button>
        </div>
    </div>
</div>

<script>
    let isRecording = false;
    let isPaused = false;
    let finalTranscript = '';
    let currentInterim = '';
    let selectedTags = new Set();
    let currentContext = 'live';

    let ws = null;
    let mediaStream = null;
    let audioCtx = null;
    let sourceNode = null;
    let processorNode = null;
    let zeroGainNode = null;
    let stopFallbackTimer = null;

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    const transcriptBox = document.getElementById('transcriptBox');
    const cleanNoteBox = document.getElementById('cleanNoteBox');
    const feedLabel = document.getElementById('feedLabel');

    const studentName = document.getElementById('studentName');
    const studentPronouns = document.getElementById('studentPronouns');
    const classYear = document.getElementById('classYear');
    const studentMajor = document.getElementById('studentMajor');
    const noteLength = document.getElementById('noteLength');
    const apptSequence = document.getElementById('apptSequence');
    const apptType = document.getElementById('apptType');

    const copyTranscriptBtn = document.getElementById('copyTranscriptBtn');
    const uploadAudioBtn = document.getElementById('uploadAudioBtn');
    const audioFileInput = document.getElementById('audioFileInput');
    const copyNoteBtn = document.getElementById('copyNoteBtn');
    const tagCloud = document.getElementById('tagCloud');

    function switchContext(mode) {
        currentContext = mode;
        const liveBtn = document.getElementById('liveModeBtn');
        const dictateBtn = document.getElementById('dictateModeBtn');

        if (mode === 'live') {
            liveBtn.classList.add('active');
            dictateBtn.classList.remove('active');
            feedLabel.innerText = "Live Feed Stream (Raw Continuous Dialogue)";
        } else {
            dictateBtn.classList.add('active');
            liveBtn.classList.remove('active');
            feedLabel.innerText = "Live Feed Stream (Solo Dictation Scribing)";
        }

        if (isRecording && !isPaused) {
            statusText.innerText = currentContext === 'live'
                ? "Listening to dialogue stream..."
                : "Recording dictation recollection...";
        }

        generateIngestionPayload();
    }

    [studentName, studentPronouns, classYear, studentMajor, noteLength, apptSequence, apptType].forEach(element => {
        element.addEventListener('input', generateIngestionPayload);
    });

    transcriptBox.addEventListener('input', () => {
        if (!isRecording || isPaused) {
            finalTranscript = transcriptBox.value;
            currentInterim = '';
        }
        generateIngestionPayload();
    });

    tagCloud.addEventListener('click', (e) => {
        if (e.target.classList.contains('tag-btn')) {
            const tag = e.target.getAttribute('data-tag');
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
                e.target.classList.remove('selected');
            } else {
                selectedTags.add(tag);
                e.target.classList.add('selected');
            }
            generateIngestionPayload();
        }
    });

    function appendTranscriptSegment(base, segment) {
        if (!segment) return base;
        if (!base) return segment.trimStart();
        const baseEndsWithSpace = /\s$/.test(base);
        const segStartsWithSpaceOrPunct = /^[\s.,!?;:'")\]\-]/.test(segment);
        if (baseEndsWithSpace || segStartsWithSpaceOrPunct) {
            return base + segment;
        }
        return base + ' ' + segment;
    }

    function promoteInterimToFinal() {
        if (currentInterim && currentInterim.trim()) {
            finalTranscript = appendTranscriptSegment(finalTranscript, currentInterim);
            currentInterim = '';
            transcriptBox.value = finalTranscript;
            generateIngestionPayload();
        }
    }

    function downsampleTo16kHz(buffer, inputSampleRate) {
        if (inputSampleRate === 16000) return buffer;
        const ratio = inputSampleRate / 16000;
        const newLength = Math.round(buffer.length / ratio);
        const result = new Float32Array(newLength);
        let offsetResult = 0;
        let offsetBuffer = 0;
        while (offsetResult < result.length) {
            const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
            let accum = 0;
            let count = 0;
            for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                accum += buffer[i];
                count++;
            }
            result[offsetResult] = count > 0 ? accum / count : 0;
            offsetResult++;
            offsetBuffer = nextOffsetBuffer;
        }
        return result;
    }

    function float32ToBase64Pcm16(float32Array) {
        const buffer = new ArrayBuffer(float32Array.length * 2);
        const view = new DataView(buffer);
        for (let i = 0; i < float32Array.length; i++) {
            const clamped = Math.max(-1, Math.min(1, float32Array[i]));
            view.setInt16(i * 2, clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff, true);
        }
        const bytes = new Uint8Array(buffer);
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
    }

    function arrayBufferToBase64(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
    }

    function teardownAudioPipeline() {
        if (processorNode) {
            processorNode.onaudioprocess = null;
            try { processorNode.disconnect(); } catch {}
            processorNode = null;
        }
        if (sourceNode) {
            try { sourceNode.disconnect(); } catch {}
            sourceNode = null;
        }
        if (zeroGainNode) {
            try { zeroGainNode.disconnect(); } catch {}
            zeroGainNode = null;
        }
        if (audioCtx) {
            try { audioCtx.close(); } catch {}
            audioCtx = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
    }

    function closeWebSocketGracefully() {
        if (stopFallbackTimer) {
            clearTimeout(stopFallbackTimer);
            stopFallbackTimer = null;
        }
        const socket = ws;
        if (!socket) return;

        if (socket.readyState === WebSocket.OPEN) {
            try {
                socket.send(JSON.stringify({ type: 'stop' }));
            } catch {}
            stopFallbackTimer = setTimeout(() => {
                if (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING) {
                    try { socket.close(); } catch {}
                }
                if (ws === socket) ws = null;
                promoteInterimToFinal();
            }, 450);
        } else {
            try { socket.close(); } catch {}
            ws = null;
            promoteInterimToFinal();
        }
    }

    function resetControlButtonsToIdle() {
        startBtn.style.display = 'inline-block';
        pauseBtn.style.display = 'none';
        resumeBtn.style.display = 'none';
        stopBtn.style.display = 'none';
    }

    async function beginLiveCapture() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            statusIndicator.className = 'indicator';
            statusText.innerText = "Microphone capture is unavailable in this browser.";
            isRecording = false;
            isPaused = false;
            resetControlButtonsToIdle();
            return;
        }

        statusIndicator.className = 'indicator active';
        statusText.innerText = "Connecting high-accuracy transcription stream...";

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });
        } catch (err) {
            isRecording = false;
            isPaused = false;
            teardownAudioPipeline();
            resetControlButtonsToIdle();
            statusIndicator.className = 'indicator';
            statusText.innerText = err && err.message
                ? "Microphone access denied: " + err.message
                : "Microphone access denied.";
            return;
        }

        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${wsProtocol}//${location.host}/ws/transcribe`);
        ws = socket;

        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            try {
                audioCtx = new AudioCtx({ sampleRate: 16000 });
            } catch {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            sourceNode = audioCtx.createMediaStreamSource(mediaStream);
            processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
            zeroGainNode = audioCtx.createGain();
            zeroGainNode.gain.value = 0;

            sourceNode.connect(processorNode);
            processorNode.connect(zeroGainNode);
            zeroGainNode.connect(audioCtx.destination);

            processorNode.onaudioprocess = (event) => {
                if (!isRecording || isPaused || socket.readyState !== WebSocket.OPEN) return;
                const inputData = event.inputBuffer.getChannelData(0);
                const pcm16k = downsampleTo16kHz(inputData, audioCtx.sampleRate);
                const base64Audio = float32ToBase64Pcm16(pcm16k);
                socket.send(JSON.stringify({ audio: base64Audio }));
            };
        } catch (err) {
            isRecording = false;
            isPaused = false;
            teardownAudioPipeline();
            try { socket.close(); } catch {}
            ws = null;
            resetControlButtonsToIdle();
            statusIndicator.className = 'indicator';
            statusText.innerText = "Audio capture initialization failed.";
            return;
        }

        socket.onmessage = (event) => {
            let msg;
            try {
                msg = JSON.parse(event.data);
            } catch {
                return;
            }

            if (msg.type === 'ready') {
                if (isRecording && !isPaused) {
                    statusIndicator.className = 'indicator active';
                    statusText.innerText = currentContext === 'live'
                        ? "Listening to dialogue stream..."
                        : "Recording dictation recollection...";
                }
            } else if (msg.type === 'interim') {
                currentInterim = msg.text || '';
                transcriptBox.value = appendTranscriptSegment(finalTranscript, currentInterim);
                transcriptBox.scrollTop = transcriptBox.scrollHeight;
                generateIngestionPayload();
            } else if (msg.type === 'final') {
                finalTranscript = appendTranscriptSegment(finalTranscript, msg.text || '');
                currentInterim = '';
                transcriptBox.value = finalTranscript;
                transcriptBox.scrollTop = transcriptBox.scrollHeight;
                generateIngestionPayload();
            } else if (msg.type === 'error') {
                isRecording = false;
                isPaused = false;
                teardownAudioPipeline();
                if (ws === socket) ws = null;
                resetControlButtonsToIdle();
                statusIndicator.className = 'indicator';
                statusText.innerText = msg.message || "Transcription error occurred.";
            } else if (msg.type === 'closed') {
                if (ws === socket) ws = null;
                promoteInterimToFinal();
            }
        };

        socket.onerror = () => {
            if (isRecording && !isPaused) {
                isRecording = false;
                isPaused = false;
                teardownAudioPipeline();
                resetControlButtonsToIdle();
                statusIndicator.className = 'indicator';
                statusText.innerText = "Transcription WebSocket connection failed.";
            }
        };

        socket.onclose = () => {
            if (ws === socket) ws = null;
            promoteInterimToFinal();
        };
    }

    startBtn.addEventListener('click', async () => {
        finalTranscript = '';
        currentInterim = '';
        transcriptBox.value = '';
        isRecording = true;
        isPaused = false;

        startBtn.style.display = 'none';
        pauseBtn.style.display = 'inline-block';
        resumeBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        generateIngestionPayload();

        await beginLiveCapture();
    });

    pauseBtn.addEventListener('click', () => {
        if (isRecording && !isPaused) {
            isPaused = true;
            promoteInterimToFinal();
            finalTranscript = transcriptBox.value;
            teardownAudioPipeline();
            closeWebSocketGracefully();
            statusIndicator.className = 'indicator paused';
            statusText.innerText = "Hardware feed paused.";
            pauseBtn.style.display = 'none';
            resumeBtn.style.display = 'inline-block';
        }
    });

    resumeBtn.addEventListener('click', async () => {
        if (isRecording && isPaused) {
            isPaused = false;
            finalTranscript = transcriptBox.value;
            currentInterim = '';
            resumeBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';
            await beginLiveCapture();
        }
    });

    stopBtn.addEventListener('click', () => {
        isRecording = false;
        isPaused = false;
        teardownAudioPipeline();
        closeWebSocketGracefully();
        resetControlButtonsToIdle();
        statusIndicator.className = 'indicator';
        statusText.innerText = "System Idle";
        generateIngestionPayload();
    });

    uploadAudioBtn.addEventListener('click', () => {
        audioFileInput.value = '';
        audioFileInput.click();
    });

    audioFileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (file.size > 20 * 1024 * 1024) {
            statusIndicator.className = 'indicator';
            statusText.innerText = "Audio file exceeds 20 MB limit.";
            return;
        }

        statusIndicator.className = 'indicator active';
        statusText.innerText = "Transcribing audio file...";
        uploadAudioBtn.disabled = true;

        try {
            const buffer = await file.arrayBuffer();
            const base64Audio = arrayBufferToBase64(buffer);
            const mimeType = file.type || 'audio/mp3';

            const response = await fetch('/api/transcribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    audio: base64Audio,
                    mimeType,
                    context: currentContext
                })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Failed to transcribe audio file.');
            }

            const fileTranscript = (data.transcript || '').trim();
            if (fileTranscript) {
                finalTranscript = appendTranscriptSegment(transcriptBox.value.trim(), fileTranscript);
                currentInterim = '';
                transcriptBox.value = finalTranscript;
                generateIngestionPayload();
            }

            statusIndicator.className = 'indicator';
            statusText.innerText = "Audio file transcription complete";
        } catch (err) {
            statusIndicator.className = 'indicator';
            statusText.innerText = err && err.message ? err.message : "Audio transcription failed.";
        } finally {
            uploadAudioBtn.disabled = false;
        }
    });

    function generateIngestionPayload() {
        const name = studentName.value.trim() || "[Student Preferred Name]";
        const pronouns = studentPronouns.value || "[Pronouns Not Specified]";
        const year = classYear.value || "[Year]";
        const major = studentMajor.value.trim() || "[Major]";
        const lengthStyle = noteLength.value;
        const sequence = apptSequence.value;
        const type = apptType.value.trim() || "[Appointment Type]";
        let rawText = transcriptBox.value.trim();

        if (!rawText) {
            cleanNoteBox.value = "Waiting for raw audio context data stream to compile template execution payload parameters...";
            return;
        }

        const tagArray = Array.from(selectedTags);
        const tagsString = tagArray.length > 0 ? tagArray.join(' ') : "None selected";

        // Assign correct macro command based on selected layout length format variable
        let macroCommand = lengthStyle === 'Condensed' ? '/appointment_note_short' : '/appointment_note';

        let compiledBlock = `${macroCommand}\n\n`;
        compiledBlock += `Generate a professional appointment observation for a career advising appointment with ${name}.\n\n`;
        compiledBlock += `[METADATA VARIABLES]\n`;
        compiledBlock += `- Session Format Context: ${currentContext === 'live' ? 'LIVE MULTI-SPEAKER ADVISING DIALOGUE' : 'POST-SESSION ADVISOR DICTATION'}\n`;
        compiledBlock += `- Appointment Detail Target: ${lengthStyle.toUpperCase()}\n`;
        compiledBlock += `- Appointment Sequence: ${sequence}\n`;
        compiledBlock += `- Student Preferred Pronouns: ${pronouns}\n`;
        compiledBlock += `- Class Year: ${year === "[Year]" ? "BLANK/OMITTED" : year}\n`;
        compiledBlock += `- Major / Intended Major: ${major === "[Major]" ? "BLANK/OMITTED" : major}\n`;
        compiledBlock += `- Appointment Type Focus: ${type === "[Appointment Type]" ? "BLANK/OMITTED" : type}\n`;
        compiledBlock += `- Selected Relevance Tags: ${tagsString}\n\n`;

        if (currentContext === 'live') {
            compiledBlock += `[RAW INTERACTIVE DIALOGUE FEED - NOTE TO AI: DIALOGUE STREAM CONTAINS CONVERSATION CO-MINGLED BETWEEN ADVISOR AND STUDENT. PARSE LOGICALLY SEPARATING STATEMENTS BY INDIVIDUAL SPEAKERS BASED ON NATURAL CONTEXT PATTERNS]\n`;
        } else {
            compiledBlock += `[SUMMARY DICTATION RECOLLECTION - NOTE TO AI: THE FOLLOWING IS A SOLO DICTATED ACCOUNT RECALLING ENTIRE APPOINTMENT TOPICS FROM THE PERSPECTIVE OF THE ADVISOR]\n`;
        }

        compiledBlock += `"${rawText}"`;

        cleanNoteBox.value = compiledBlock;
    }

    copyTranscriptBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(transcriptBox.value);
    });

    copyNoteBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(cleanNoteBox.value);
        const origColor = copyNoteBtn.style.backgroundColor;
        copyNoteBtn.style.backgroundColor = "#2ec4b6";
        copyNoteBtn.innerText = "Payload Copied!";
        setTimeout(() => {
            copyNoteBtn.style.backgroundColor = origColor;
            copyNoteBtn.innerText = "Copy Prompt Payload";
        }, 2000);
    });
</script>

</body>
</html>
